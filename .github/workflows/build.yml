name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK with Gradle
      run: |
        set -o pipefail
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon 2>&1 | tee build_log.txt || {
          echo "=========================================="
          echo "       KOTLIN COMPILER ERROR DETAILS      "
          echo "=========================================="
          grep -E "^e: |error:|ERROR:|A failure occurred" build_log.txt || tail -n 50 build_log.txt
          exit 1
        }

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
