name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon 2>&1 | tee build_log.txt || BUILD_EXIT_CODE=$?
        if [ "${BUILD_EXIT_CODE:-0}" -ne 0 ]; then
          echo "=========================================="
          echo "       KOTLIN COMPILER ERROR DETAILS      "
          echo "=========================================="
          grep -E "e: |error:|ERROR:|A failure occurred" build_log.txt || true
          echo "=========================================="
          echo "       LAST 40 LINES OF BUILD LOG         "
          echo "=========================================="
          tail -n 40 build_log.txt
          exit $BUILD_EXIT_CODE
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
